services:
  api:
    platform: linux/amd64
    build: .
    image: cigarette-detection-yolo
    container_name: cigarette-detection-api
    ports:
      - "8000:8000"
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app
    environment:
      - PYTHONUNBUFFERED=1
      - HOME=/usr/src/app
      - YOLO_CONFIG_DIR=/usr/src/app/.config
      - TORCHINDUCTOR_CACHE_DIR=/usr/src/app/.cache
      - PYTHONPATH=/usr/src/app
    user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s